name: CoreFW code firmware CI (X / Pro Mk3)

on:
  push:
    branches: [code]
  pull_request:
    branches: [code]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: lpx
            feature: launchpad-x
            firmware: core-launchpad-x
            model: Launchpad X
            product: /x
          - device: lppmk3
            feature: launchpad-pro-mk3
            firmware: core-launchpad-pro-mk3
            model: Launchpad Pro MK3
            product: /lppmk3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          targets: thumbv7em-none-eabihf
          components: rust-src,llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.device }}
      - name: Test package tooling
        run: cargo test --locked -p xtask --no-default-features --features ${{ matrix.feature }}
      - name: Package ${{ matrix.model }} only
        env:
          CORE_FW_CARGO_LOCKED: '1'
        run: cargo run --locked -p xtask --bin xtask --no-default-features --features ${{ matrix.feature }} -- package ${{ matrix.device }} --release
      - name: Verify package and manifest
        env:
          MODEL: ${{ matrix.model }}
          PRODUCT: ${{ matrix.product }}
          FIRMWARE: ${{ matrix.firmware }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          build = pathlib.Path('build')
          syx = build / (os.environ['FIRMWARE'] + '.syx')
          manifest = build / (os.environ['FIRMWARE'] + '.manifest.json')
          assert syx.is_file() and syx.stat().st_size > 0
          assert manifest.is_file() and manifest.stat().st_size > 0
          data = json.loads(manifest.read_text())
          assert data['model']['name'] == os.environ['MODEL']
          assert data['updater']['product'] == os.environ['PRODUCT']
          assert data['source_commit'] == os.environ['SOURCE_SHA']
          assert data['source_dirty'] is False
          record = next(a for a in data['artifacts'] if a['name'] == syx.name)
          assert record['size'] == syx.stat().st_size
          assert record['sha256'] == hashlib.sha256(syx.read_bytes()).hexdigest()
          assert record['message_count'] > 0
          (build / 'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in (syx, manifest)))
          PY
      - name: Verify checksums
        working-directory: build
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload unverified firmware
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-${{ github.sha }}-UNVERIFIED
          path: |
            build/${{ matrix.firmware }}.syx
            build/${{ matrix.firmware }}.manifest.json
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Summarize artifact
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          MODEL: ${{ matrix.model }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -n "$ARTIFACT_URL"
          {
            echo "## $MODEL (hardware unverified)"
            echo "- [Download firmware and manifest]($ARTIFACT_URL)"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo '- ZIP includes .syx, .manifest.json and SHA256SUMS.txt; firmware is not automatically flashed or released.'
          } >> "$GITHUB_STEP_SUMMARY"
