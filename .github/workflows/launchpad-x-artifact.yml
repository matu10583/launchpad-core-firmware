name: Launchpad X firmware artifact

on:
  push:
    branches:
      - launchpad-x-baseline
      - launchpad-x-hold-low
      - launchpad-x-led-feedback
      - launchpad-x-hold-80-led
      - launchpad-x-press-180-led
      - launchpad-x-hold-48-led
      - launchpad-x-hold-8-led
      - launchpad-x-press-112-hold-8-led
      - launchpad-x-note-mode
      - launchpad-x-note-mode-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lpx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/launchpad-x-baseline' || github.ref == 'refs/heads/launchpad-x-hold-low' || github.ref == 'refs/heads/launchpad-x-led-feedback' || github.ref == 'refs/heads/launchpad-x-hold-80-led' || github.ref == 'refs/heads/launchpad-x-press-180-led' || github.ref == 'refs/heads/launchpad-x-hold-48-led' || github.ref == 'refs/heads/launchpad-x-hold-8-led' || github.ref == 'refs/heads/launchpad-x-press-112-hold-8-led' || github.ref == 'refs/heads/launchpad-x-note-mode' || github.ref == 'refs/heads/launchpad-x-note-mode-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust and ARM tools
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          targets: thumbv7em-none-eabihf
          components: rust-src,llvm-tools

      - name: Check host xtask tests
        run: cargo test --locked -p xtask

      - name: Package Launchpad X only
        env:
          CORE_FW_CARGO_LOCKED: '1'
        run: cargo run --locked -p xtask -- package lpx --release

      - name: Validate and stage artifact
        id: metadata
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil
          root = pathlib.Path('build')
          syx = root / 'core-launchpad-x.syx'
          manifest = root / 'core-launchpad-x.manifest.json'
          for path in (syx, manifest):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty: {path}')
          branch = os.environ['REF_NAME']
          expected = {'launchpad-x-baseline': (300, 144), 'launchpad-x-hold-low': (300, 112),
                      'launchpad-x-led-feedback': (300, 144), 'launchpad-x-hold-80-led': (300, 80),
                      'launchpad-x-press-180-led': (180, 80), 'launchpad-x-hold-48-led': (300, 48),
                      'launchpad-x-hold-8-led': (300, 8), 'launchpad-x-press-112-hold-8-led': (112, 8),
                      'launchpad-x-note-mode': (112, 8), 'launchpad-x-note-mode-v2': (112, 8)}
          if branch not in expected:
              raise SystemExit(f'Unexpected branch: {branch}')
          text = pathlib.Path('src/sys/driver/launchpad-x/inputs.rs').read_text()
          def constant(name):
              match = re.search(r'^const ' + name + r': u16 = (\d+);$', text, re.M)
              if not match:
                  raise SystemExit(f'Missing constant: {name}')
              return int(match[1])
          start, release = constant('LP_PRESS_START_NORM'), constant('LP_PRESS_RELEASE_NORM')
          if (start, release) != expected[branch]:
              raise SystemExit(f'Unexpected thresholds: start={start}, release={release}')
          if branch in ('launchpad-x-press-180-led', 'launchpad-x-press-112-hold-8-led', 'launchpad-x-note-mode'):
              if constant('LP_VELOCITY_START_NORM') != 300:
                  raise SystemExit('Velocity curve anchor must remain 300')
              curve = text.split('fn norm_to_velocity(norm: u16)', 1)[1].split('fn norm_to_aftertouch', 1)[0]
              if 'LP_PRESS_START_NORM' in curve or curve.count('LP_VELOCITY_START_NORM') != 2:
                  raise SystemExit('Velocity curve must use its independent anchor')
          if branch == 'launchpad-x-note-mode-v2':
              if constant('LP_VELOCITY_START_NORM') != 112:
                  raise SystemExit('Note Mode v2 velocity anchor must be 112')
              curve = text.split('fn norm_to_velocity(norm: u16)', 1)[1].split('fn norm_to_aftertouch', 1)[0]
              if 'velocity::map(norm, LP_VELOCITY_START_NORM)' not in curve:
                  raise SystemExit('Note Mode v2 velocity mapping not used')
          led_enabled = branch in ('launchpad-x-led-feedback', 'launchpad-x-hold-80-led', 'launchpad-x-press-180-led', 'launchpad-x-hold-48-led', 'launchpad-x-hold-8-led', 'launchpad-x-press-112-hold-8-led')
          if led_enabled:
              feedback = pathlib.Path('src/app/performance/mod.rs').read_text()
              if 'led::set(index, if event.pressed { 0x00ff00 } else { 0 });' not in feedback:
                  raise SystemExit('Local press/release LED feedback not found')
          if branch in ('launchpad-x-note-mode', 'launchpad-x-note-mode-v2'):
              paths = ['src/app/note/mod.rs', 'src/app/note/layout.rs']
              if branch == 'launchpad-x-note-mode-v2':
                  paths.append('src/app/note/velocity.rs')
              for path in paths:
                  if not pathlib.Path(path).is_file():
                      raise SystemExit(f'Missing Note Mode source: {path}')
          data = json.loads(manifest.read_text())
          if (data['model']['name'] != 'Launchpad X'
                  or data['updater']['product'] != '/x'
                  or data['source_commit'] != os.environ['SOURCE_SHA']
                  or data['source_dirty'] is not False):
              raise SystemExit('Manifest model, product, SHA, or source cleanliness mismatch')
          record = next((a for a in data['artifacts'] if a['name'] == syx.name), None)
          if not record or record['size'] != syx.stat().st_size:
              raise SystemExit('SysEx manifest size mismatch')
          import hashlib
          digest = hashlib.sha256(syx.read_bytes()).hexdigest()
          if record['sha256'] != digest or not record['message_count']:
              raise SystemExit('SysEx digest or message count mismatch')
          stage = pathlib.Path('artifact')
          stage.mkdir()
          shutil.copy2(syx, stage / syx.name)
          shutil.copy2(manifest, stage / manifest.name)
          lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in (stage / syx.name, stage / manifest.name)]
          (stage / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          kinds = {'launchpad-x-baseline': 'baseline（上流の感度値を変更していない版）',
                   'launchpad-x-hold-low': '実験版（保持感度の試作）',
                   'launchpad-x-led-feedback': 'LED確認版（baselineの感度値、押下中だけ緑に点灯）',
                   'launchpad-x-hold-80-led': '保持感度の追加試作（LED点灯、解放80）',
                   'launchpad-x-press-180-led': '押下開始の追加試作（LED点灯、開始180、解放80）',
                   'launchpad-x-hold-48-led': '保持感度の追加試作（LED点灯、解放48）',
                   'launchpad-x-hold-8-led': '極端な保持感度の試作（LED点灯、解放8、鳴りっぱなし注意）',
                   'launchpad-x-press-112-hold-8-led': '軽い押下の試作（LED点灯、開始112、解放8）',
                   'launchpad-x-note-mode': '演奏用Note Modeの試作（固定3配列、移調、音階LED、開始112／解放8）',
                   'launchpad-x-note-mode-v2': '演奏用Note Mode v2（2行重複、移調リセット、同音LED、改善ベロシティ）'}
          kind = kinds[branch]
          led_description = (f'音階配列と同音パッドの押下表示。操作: https://github.com/matu10583/launchpad-core-firmware/blob/{branch}/LAUNCHPAD-X-NOTE-MODE.md'
                             if branch in ('launchpad-x-note-mode', 'launchpad-x-note-mode-v2') else
                             '押下中だけ緑に点灯し解放時に消灯（ホストからのLED命令がない場合）'
                             if led_enabled else 'パッドのローカル点灯なし')
          (stage / '説明.txt').write_text(
              f'対象: Novation Launchpad X（Pro / Pro MK3 ではありません）\n'
              f'種別: {kind}\nソースSHA: {os.environ["SOURCE_SHA"]}\n'
              'ツールチェーン: Rust 1.94.1 / thumbv7em-none-eabihf / rust-src / llvm-tools; GitHub ubuntu-24.04\n'
              f'CoreFW内部値: LP_PRESS_START_NORM={start}, LP_PRESS_RELEASE_NORM={release}; ベロシティ計算の基準={constant("LP_VELOCITY_START_NORM") if branch in ("launchpad-x-press-180-led", "launchpad-x-press-112-hold-8-led", "launchpad-x-note-mode", "launchpad-x-note-mode-v2") else 300}\n'
              f'LED: {led_description}\n'
              '実機未検証。純正ファームウェアの設定値・動作を示すものではありません。\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'kind={branch.removeprefix("launchpad-x-")}\nstart={start}\nrelease={release}\nshort_sha={os.environ["SOURCE_SHA"][:12]}\n')
          PY
          cd artifact
          sha256sum --check SHA256SUMS.txt

      - name: Upload four files (14 days)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-x-${{ steps.metadata.outputs.kind }}-${{ steps.metadata.outputs.short_sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SOURCE_SHA: ${{ github.sha }}
          KIND: ${{ steps.metadata.outputs.kind }}
          RELEASE: ${{ steps.metadata.outputs.release }}
          START: ${{ steps.metadata.outputs.start }}
        run: |
          test -n "$ARTIFACT_URL"
          {
            echo '## Launchpad X firmware（実機未検証）'
            echo "- Artifact: [$KIND（ZIP）]($ARTIFACT_URL)"
            echo "- ソースSHA: \`$SOURCE_SHA\`"
            echo "- CoreFW内部値: LP_PRESS_START_NORM=$START, LP_PRESS_RELEASE_NORM=$RELEASE（ベロシティ曲線の基準は300）"
            echo '- Rust 1.94.1 / thumbv7em-none-eabihf / rust-src / llvm-tools'
            echo '- PCのブラウザでArtifactのZIPを取得し、中の `core-launchpad-x.syx` を使う。書き込み前に説明と復旧手順を確認。'
          } >> "$GITHUB_STEP_SUMMARY"
